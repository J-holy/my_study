<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="영어 단어 시험지, 오답노트, 깨끗한 시험지를 만드는 공부 도구 모음">
<title>my_study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--surface:#fff;--ink:#18181b;--mute:#71717a;--line:#e4e4e7;--hover:#f4f4f5;--bar-h:52px}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f11;--surface:#18181b;--ink:#f4f4f5;--mute:#a1a1aa;--line:#27272a;--hover:#1f1f23}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
body.in-app{overflow:hidden}

/* top tab bar */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:stretch;height:calc(var(--bar-h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;margin-right:28px;font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.tabs{display:flex;align-items:stretch;gap:20px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--mute);font-weight:500;font-size:14px;text-decoration:none;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
@media (max-width:480px){.brand{margin-right:20px}.tabs{gap:16px}}

/* home */
#home{max-width:640px;margin:0 auto;padding:72px 16px 64px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.lead{color:var(--mute);font-size:15px;margin:0 0 40px}
.list{display:grid;gap:12px}
a.item{display:flex;align-items:center;gap:16px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;transition:border-color .15s,background .15s}
a.item:hover,a.item:focus-visible{border-color:var(--ink);outline:none}
.ico{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--hover);color:var(--ink)}
.ico svg{width:22px;height:22px}
.txt{flex:1;min-width:0}
.item h2{font-size:16px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
.item p{margin:0;color:var(--mute);font-size:14px}
.chev{flex:none;width:18px;height:18px;color:var(--mute);transition:transform .15s,color .15s}
a.item:hover .chev{transform:translateX(2px);color:var(--ink)}
footer{margin-top:40px;color:var(--mute);font-size:13px}
.ver{margin-top:8px;color:var(--mute);font-size:12px}
@media (max-width:480px){#home{padding-top:48px}a.item{padding:16px}}

/* app frames: each app stays loaded while you switch tabs */
.frame{display:block;width:100%;height:calc(100vh - var(--bar-h) - env(safe-area-inset-top,0px));height:calc(100dvh - var(--bar-h) - env(safe-area-inset-top,0px));border:0;background:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="#home">my_study</a>
  <nav class="tabs" role="tablist" aria-label="앱 선택">
    <a class="tab" role="tab" href="#home" data-app="home" aria-selected="true">홈</a>
    <a class="tab" role="tab" href="#word-test" data-app="word-test" aria-selected="false">단어 시험지</a>
    <a class="tab" role="tab" href="#odap-note" data-app="odap-note" aria-selected="false">오답노트</a>
    <a class="tab" role="tab" href="#clean-sheet" data-app="clean-sheet" aria-selected="false">깨끗한 시험지</a>
  </nav>
</header>

<main id="home">
  <h1>공부 도구</h1>
  <p class="lead">설치 없이 브라우저에서 바로 쓰는 학습 도구예요.</p>
  <div class="list">
    <a class="item" href="#word-test">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></span>
      <div class="txt">
        <h2>영어 단어 시험지</h2>
        <p>교재 사진에서 단어와 뜻을 읽어 시험지를 만들어요.</p>
      </div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </a>
    <a class="item" href="#odap-note">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="m10 8 4 4M14 8l-4 4"/></svg></span>
      <div class="txt">
        <h2>오답노트</h2>
        <p>틀린 문제만 골라 필기를 지우고 PDF로 정리해요.</p>
      </div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </a>
    <a class="item" href="#clean-sheet">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9 15 2 2 4-4"/></svg></span>
      <div class="txt">
        <h2>깨끗한 시험지 만들기</h2>
        <p>필기와 채점 자국을 지우고 문제만 남겨 다시 출력해요.</p>
      </div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </a>
  </div>
  <footer>단어 시험지와 오답노트 작업은 이 브라우저에만 저장돼요. 깨끗한 시험지는 완성할 때 올린 사진이 서버에 보관되고, 관리자만 볼 수 있어요.</footer>
  <p class="ver">버전 v1.08 · 2026-10-30</p>
</main>

<div id="frames"></div>

<script>
const APPS = {
  'word-test': '영어 단어 시험지',
  'odap-note': '오답노트',
  'clean-sheet': '깨끗한 시험지 만들기'
};
const HOME_TITLE = document.title;
const frames = {};

// #word-test 또는 #word-test&<앱 주소 뒤에 붙어 있던 ?…#…> 형식을 읽어요.
function parseHash() {
  const raw = location.hash.slice(1), i = raw.indexOf('&');
  const app = i < 0 ? raw : raw.slice(0, i);
  let extra = '';
  if (i >= 0) { try { extra = decodeURIComponent(raw.slice(i + 1)); } catch (e) {} }
  return { app: APPS[app] ? app : 'home', extra };
}

function frameFor(app, extra) {
  if (!frames[app]) {
    const f = document.createElement('iframe');
    f.className = 'frame';
    f.title = APPS[app];
    f.allow = 'camera; clipboard-read; clipboard-write; fullscreen; web-share';
    f.src = app + '/' + extra;
    document.getElementById('frames').appendChild(f);
    frames[app] = f;
  } else if (extra) {
    frames[app].src = app + '/' + extra;
  }
  return frames[app];
}

function show() {
  const { app, extra } = parseHash();
  if (extra) history.replaceState(null, '', '#' + app);
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.app === app)));
  document.getElementById('home').hidden = app !== 'home';
  document.body.classList.toggle('in-app', app !== 'home');
  if (app !== 'home') frameFor(app, extra);
  for (const k in frames) frames[k].hidden = k !== app;
  document.title = app === 'home' ? HOME_TITLE : APPS[app] + ' · my_study';
}

window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
